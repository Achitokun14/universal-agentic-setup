name: smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-linux:
    name: smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run setup --version
        run: ./setup --version

      - name: Run setup --help
        run: ./setup --help

      - name: Run setup --doctor (read-only)
        run: ./setup --doctor

      - name: Run setup --dry-run --yes (full plan, no changes)
        run: |
          export HOME=/tmp/fake-home
          mkdir -p "$HOME"
          ./setup --dry-run --yes

      - name: Python unittest suite (agentic_sync engine)
        run: python3 -m unittest discover -s tests -v

      - name: Run smoke test suite
        run: |
          export HOME=/tmp/fake-home-smoke
          mkdir -p "$HOME"
          bash tests/smoke.sh

      - name: Verify VERSION matches CHANGELOG
        run: |
          set -e
          ver="$(cat VERSION)"
          if ! grep -q "^## \[$ver\]" CHANGELOG.md user/docs/CHANGELOG.md; then
            echo "::error::VERSION $ver not found in CHANGELOG"
            exit 1
          fi

  smoke-macos:
    name: smoke (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: brew install jq

      - name: Run setup --version
        run: ./setup --version

      - name: Run setup --help
        run: ./setup --help

      - name: Run setup --doctor (read-only)
        run: ./setup --doctor

      - name: Run setup --dry-run --yes (full plan, no changes)
        run: |
          export HOME=/tmp/fake-home
          mkdir -p "$HOME"
          ./setup --dry-run --yes

      - name: Python unittest suite (agentic_sync engine)
        run: python3 -m unittest discover -s tests -v

      - name: Run smoke test suite
        run: |
          export HOME=/tmp/fake-home-smoke
          mkdir -p "$HOME"
          bash tests/smoke.sh

  smoke-windows:
    name: smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python unittest suite (agentic_sync engine)
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: setup.ps1 -DryRun (agent-neutral plan, no changes)
        shell: pwsh
        run: ./setup.ps1 -DryRun

      - name: agentic_sync doctor + list (read-only)
        shell: pwsh
        run: |
          python scripts/agentic_sync.py --doctor
          python scripts/agentic_sync.py --list

      - name: Verify VERSION matches CHANGELOG
        shell: pwsh
        run: |
          $ver = Get-Content VERSION -Raw
          $ver = $ver.Trim()
          $ok = (Select-String -Path CHANGELOG.md -Pattern "^## \[$ver\]" -Quiet) -and `
                (Select-String -Path user/docs/CHANGELOG.md -Pattern "^## \[$ver\]" -Quiet)
          if (-not $ok) {
            Write-Error "VERSION $ver not found in CHANGELOG"
            exit 1
          }
